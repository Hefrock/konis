name: site

# Public status page on GitHub Pages (ADR 0016). Rebuilt after every capture run and on demand.
# One-time owner setting: Settings -> Pages -> Source: "GitHub Actions".
on:
  workflow_run:
    workflows: [ingest-live]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Two jobs, as in GitHub's Pages template: when upload and deploy share one job, the
  # artifact listing can lag the upload by a moment and deploy finds "0 artifacts"
  # (seen 28 Nov, runs 46093157952 and 46104844639). The job boundary removes the race.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --no-dev
      - run: uv run --frozen konis site build --out site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
