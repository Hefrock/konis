name: ci
on:
  push:
    paths-ignore: ["data/**"]
  pull_request: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen ruff check src tests
      - run: uv run --frozen pytest -q
      - run: uv run --frozen konis parse --check
