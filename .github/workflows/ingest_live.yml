name: ingest-live

# Stage 0 capture. Schedule source of truth: docs/adr/0003-capture-schedule.md.
# Off the hour (GitHub's free scheduler is most delayed at :00; ilara lesson 6).
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: ingest-live
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Stage 2 collectors read these; unset is fine for Stage 0.
      AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
      PURPLEAIR_API_KEY: ${{ secrets.PURPLEAIR_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install (locked)
        run: uv sync --frozen --no-dev

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Capture (raw saved first; unchanged content only logged)
        run: uv run --frozen konis capture --summary-out "$RUNNER_TEMP/summary.json"

      # Documents over 9 MB are kept out of git (ADR 0008): upload them as release assets
      # first. If an upload fails the job stops here, before any commit.
      - name: Upload large documents as release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(data/_external_staging/*)
          if [ ${#files[@]} -eq 0 ]; then echo "no large documents"; exit 0; fi
          gh release view docs-archive >/dev/null 2>&1 || gh release create docs-archive \
            --title "Archived large documents" \
            --notes "Official documents too large for git. Each asset name starts with the first 16 hex digits of its sha256; manifests are under data/raw/linked_docs/ (ADR 0008)."
          existing=$(gh release view docs-archive --json assets -q '.assets[].name')
          for f in "${files[@]}"; do
            name=$(basename "$f")
            if grep -qxF "$name" <<< "$existing"; then echo "already uploaded: $name"; continue; fi
            gh release upload docs-archive "$f"
          done

      - name: Commit raw and capture log
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -q -m "data: capture ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi

      # Parsing runs after the raw commit; a failure here never reverts raw (K1).
      - name: Rebuild curated tables
        continue-on-error: true
        run: |
          uv run --frozen konis parse
          git add data/curated
          git diff --cached --quiet || git commit -q -m "data: curate ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Guards before push
        run: uv run --frozen konis guard --bot --base "$BASE_SHA"

      - name: Push with rebase retry
        run: .github/scripts/push-with-retry.sh "${GITHUB_REF_NAME}"

      - name: Alerts (open / update / close capture-failure issues)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "$RUNNER_TEMP/summary.json" ]; then
            uv run --frozen python -m konis.alerts_cli "$RUNNER_TEMP/summary.json"
          else
            gh issue create --title "capture run crashed: ${GITHUB_RUN_ID}" \
              --label capture-failure \
              --body "The capture step did not produce a summary. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              || true
          fi
